name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --extra web

      - name: Run tests
        run: uv run pytest --cov=gravity_trade --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          uv run gravity analyze NVDA --json
          uv run gravity backtest
