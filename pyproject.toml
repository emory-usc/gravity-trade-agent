[project]
name = "gravity-trade-agent"
version = "0.1.0"
description = "A LangChain/LangGraph agent that implements the Gravity Trade six-layer directional framework to score equities and emit a trade thesis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emory Long" }]
keywords = ["langchain", "langgraph", "trading", "options", "max-pain", "gex", "agent", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
llm = [
    "langchain-openai>=0.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gravity = "gravity_trade.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravity_trade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
